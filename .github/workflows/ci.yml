name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

test:
  jobs:
    runs-on: ubuntu-latest
    steps:

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.99"  

      - name: Install full dependencies list
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs.txt

      - name: Run tests
        run: |
          pytest -q